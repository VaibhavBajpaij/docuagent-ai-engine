[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "docuagent-ai-engine"
version = "1.0.0"
description = "Enterprise Multi-Agent Knowledge & Document Reasoning Engine with LangGraph, Semantic Caching via Redis, and FastAPI"
authors = [{ name = "Vaibhav Bajpai", email = "vaibhav.bajpai.tech@gmail.com" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "langgraph>=0.2.40",
    "langchain-core>=0.3.15",
    "numpy>=1.26.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.12"
]
